[package]
name = "tontoo-compositor"
version = "26.1.0"
edition = "2021"
description = "Wayland compositor for TontooOS"
license = "TCL"

[features]
default = ["winit"]
winit = ["smithay/backend_winit", "smithay/backend_egl", "smithay/renderer_gl"]
udev = [
    "smithay/backend_udev",
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_egl",
    "smithay/renderer_gl",
    "smithay/backend_libinput",
    "smithay/backend_session",
    "smithay/backend_session_libseat",
    "dep:libseat",
    "dep:gbm",
    "dep:input",
    "dep:rustix",
]

# TontooLibs via SDK – unified path (WSL: symlink /Library/System/sdk -> /mnt/c/Users/arlo1/Documents/TontooLibs/SDK)
# Example when the compositor needs a framework:
# sdk = { path = "/Library/System/sdk", features = ["Foundation", "Accessibility"] }
# then in src/main.rs: sdk::preinclude!(); use Foundation::date_now;
[dependencies]
smithay = { version = "0.7", default-features = false, features = [
    "wayland_frontend",
    "desktop",
] }
wayland-server = "0.31"
wayland-backend = "0.3"
wayland-scanner = "0.31"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bitflags = "2"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
dirs = "6"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
xcursor = "0.3"
fontdue = "0.9"
smallvec = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libseat = { version = "0.2", optional = true }
gbm = { version = "0.16", optional = true, default-features = false, features = ["drm-support"] }
input = { version = "0.9", optional = true }
rustix = { version = "0.38", optional = true, features = ["fs", "process"] }
